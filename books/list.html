<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Book List</title>
    <!-- 1. Penghubung ke CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- 2. Tombol Hamburger Menu -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="list.html">Book List</a></li>
                <li><a href="add.html">Add Book</a></li>
                <li><a href="../members/list.html">Member List</a></li>
                <li><a href="../members/add.html">Add Member</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Book List</h2>

            <!-- 3. Kotak Input Pencarian Real-Time -->
            <div class="search-box">
                <label for="search-input">Search Book Title</label>
                <input type="text" id="search-input" placeholder="Type a book title...">
            </div>

            <!-- 4. Indikator Loading Data -->
            <p id="loading-indicator" style="display: none;">Loading data...</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Year</th>
                            <th>Stock</th>
                            <th>Category</th> <!-- Ditambahkan -->
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <!-- 5. tbody dikosongkan untuk diisi secara dinamis oleh JS -->
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>

    <!-- 6. Hubungkan file Script JavaScript -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/table-loader.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Ditambahkan "category" ke dalam array nama kolom
        loadTableData("../data/books.json", ["title", "author", "year", "stock", "category"]);
      });
    </script>
</body>
</html>
