    <main>
        <section>
            <h2>Member List</h2>

            <!-- Search Box -->
            <div class="search-box">
                <label for="search-input">Search Member Name</label>
                <input type="text" id="search-input" placeholder="Type a member name...">

            <!-- Loading Indicator -->

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Member No</th>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Phone No</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Diisi secara dinamis oleh members.js -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>

    <!-- Script JavaScript -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/table-loader.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    loadTableData("../data/members.json", ["member_no", "name", "address", "phone_no"]);
  });
</script>
